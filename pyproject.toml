## 2) `pyproject.toml`

```toml
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-assist-mini"
version = "0.1.0"
description = "Cloud Assist Mini: telemetry-grounded incident assistant demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "httpx>=0.25",
  "rich>=13.7",
]

[project.scripts]
cloud-assist = "cloud_assist_mini.cli:main"
